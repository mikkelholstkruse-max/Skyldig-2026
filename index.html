<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hjemmebane">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a2b">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head>
<body>
<title>Hjemmebane</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Monoton&family=Baloo+2:wght@500;600;800&display=swap">
<style>
/* Layout: one-screen game-show stage with spotlight beams; every step is one focused card; the reveal is a detective board with red threads, a seismograph for disagreement and a race track to 21 */
:root{
  --stage:#1a0a2b;--stage-2:#2a1142;--stage-3:#3a1a58;
  --ink:#fff4e6;--muted:#c7a9d9;--hot:#ff3d7f;--bulb:#ffd23f;--thread:#ff2d4d;
  --line:rgba(255,244,230,.14);--ok:#5ef0a8;--bad:#ff6b6b;
  --t:var(--hot);
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-shade:"Bungee Shade","Bungee","Arial Black",sans-serif;
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.shake #app{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-4px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.beams{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.beams::before,.beams::after{content:"";position:absolute;top:-30%;width:90vmax;height:160vmax;opacity:.2;
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,var(--t) 175deg,transparent 190deg);transform-origin:50% 0;animation:sweep 9s ease-in-out infinite alternate}
.beams::before{left:-30vmax}
.beams::after{right:-30vmax;background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,var(--bulb) 175deg,transparent 190deg);animation-delay:-4s;opacity:.12}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#bg,#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#bg{z-index:0}#fx{z-index:40}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:18px 120px}

.marquee{position:relative;text-align:center;padding:20px 12px 16px;border-radius:18px;background:var(--stage-2);box-shadow:0 0 0 3px var(--hot),0 0 40px -6px var(--hot)}
.marquee::before{content:"";position:absolute;inset:6px;border-radius:13px;pointer-events:none;padding:5px;
  background:radial-gradient(circle,var(--bulb) 2.5px,transparent 3.5px) 0 0/16px 16px;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.logo{font-family:var(--f-shade);font-size:clamp(46px,15vw,78px);line-height:1;color:var(--bulb);margin:0;text-shadow:0 0 18px rgba(255,210,63,.55)}
.logo.sm{font-size:24px;text-shadow:none}
.tag{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;color:var(--hot);margin-top:8px;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.lbl{font-family:var(--f-display);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
p{margin:0}.muted{color:var(--muted)}.c{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col-stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--stage-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--bulb);outline-offset:2px}
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;padding:16px 20px;border-radius:14px;background:var(--hot);color:var(--stage);box-shadow:0 5px 0 #9e1747;transition:transform .08s,box-shadow .08s;width:100%;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9e1747}
.btn.gold{background:var(--bulb);box-shadow:0 5px 0 #a8820c}.btn.gold:active{box-shadow:0 1px 0 #a8820c}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.red{background:var(--thread);color:var(--ink);box-shadow:0 5px 0 #8a0f22}
.btn.sm{font-size:14px;padding:11px 14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
.iconbtn{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;padding:8px 10px;border-radius:999px;background:var(--stage-2);border:1px solid var(--line);color:var(--muted)}

.mode{display:grid;gap:12px}
.mode button{text-align:left;padding:18px;border-radius:16px;background:var(--stage-2);border:2px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:border-color .2s,transform .2s}
.mode button:hover{border-color:var(--hot);transform:translateY(-2px)}
.mode b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--bulb)}
.mode .discobtn{background:linear-gradient(120deg,#ff3fa4,#ff8a00,#ffd400,#00c2ff,#7a3cff);border:3px solid #fffaf0;color:#1a1035}
.mode .discobtn b{font-family:"Monoton","Arial Black",sans-serif;color:#fffaf0;font-size:26px;text-shadow:2px 2px 0 #1a1035}
.mode .discobtn span{font-weight:800}
.pitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pitch div{border-radius:12px;padding:10px 12px;background:var(--stage-2);border-left:4px solid var(--c);font-size:13px;color:var(--muted)}
.pitch b{display:block;font-family:var(--f-display);font-weight:400;font-size:13px;color:var(--ink);letter-spacing:.04em}

input[type=text],input[type=number],textarea{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--stage);color:var(--ink);min-width:0}
textarea{min-height:80px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--stage);padding:5px;border-radius:14px}
.seg button{padding:11px 4px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--hot);color:var(--stage)}

/* avatarer */
.av{--sz:30px;width:var(--sz);height:var(--sz);border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--sz)*.45);color:#1a0a2b;background:var(--pc);flex:none;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.m{--sz:44px}.av.l{--sz:72px;box-shadow:0 0 0 3px var(--stage),0 0 0 6px var(--pc)}.av.xl{--sz:104px;box-shadow:0 0 0 4px var(--stage),0 0 0 8px var(--pc)}
.selfie{position:relative;display:inline-block;cursor:pointer}
.selfie input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.selfie .cam{position:absolute;right:-4px;bottom:-4px;background:var(--bulb);color:var(--stage);font-family:var(--f-display);font-size:9px;padding:3px 5px;border-radius:6px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--stage);border:1px solid var(--line);font-weight:700}
.chip .x{width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.aka{font-size:12px;color:var(--muted);font-weight:600;font-style:italic;display:block}

/* rundekort */
.typecard{position:relative;overflow:hidden;border-radius:22px;padding:28px 20px;text-align:center;background:var(--t);color:var(--stage);animation:typein .7s cubic-bezier(.2,1.3,.4,1) both}
.typecard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 14px,transparent 14px 28px)}
@keyframes typein{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.typecard .big{position:relative;z-index:1;font-family:var(--f-shade);font-size:clamp(32px,10.5vw,52px);line-height:1}
.typecard .sub{position:relative;z-index:1;font-weight:800;margin-top:8px}
.event{border-radius:16px;padding:14px;text-align:center;background:var(--bulb);color:var(--stage);animation:typein .6s .3s both}
.event b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.qcard{position:relative;background:var(--ink);color:var(--stage);border-radius:22px;padding:26px 22px 22px;transform:rotate(-1.2deg);box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.qcard .lbl{color:#7b4f8f}
.qcard .q{font-family:var(--f-display);font-size:clamp(21px,6.3vw,29px);line-height:1.15;margin-top:8px;text-wrap:balance}
.qcard .q.quote{font-family:var(--f-body);font-weight:800;font-style:italic}
.qcard .stamp{position:absolute;top:-14px;right:14px;background:var(--t);color:var(--stage);font-family:var(--f-display);font-size:12px;padding:6px 10px;border-radius:8px;transform:rotate(4deg);letter-spacing:.08em}
.ex{display:inline-block;margin-left:6px;background:#7b4f8f;color:var(--ink);font-family:var(--f-display);font-size:10px;padding:2px 6px;border-radius:5px;vertical-align:middle;letter-spacing:.04em}
.deal{animation:deal .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes deal{from{transform:translateY(40px) rotate(8deg) scale(.8);opacity:0}}

.cands{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:16px;background:var(--stage-2);border:2px solid var(--line);font-weight:800;text-align:center;min-width:0;word-break:break-word}
.cands>:nth-child(2){animation-delay:.1s}.cands>:nth-child(3){animation-delay:.2s}.cands>:nth-child(4){animation-delay:.3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 12px;border-radius:16px;background:var(--stage-2);border:2px solid var(--line);font-weight:800;font-size:17px;text-align:center;min-height:72px;display:flex;align-items:center;justify-content:center;gap:8px;word-break:break-word;min-width:0}
button.who:active,button.opt:active{transform:scale(.96)}
button[aria-pressed=true].who,button[aria-pressed=true].opt{border-color:var(--t);background:var(--stage-3);box-shadow:0 0 24px -4px var(--t)}
.numwrap{display:flex;gap:10px;align-items:center}
.numwrap input{font-family:var(--f-display);font-size:28px;text-align:center}
.numwrap span{font-weight:800;color:var(--muted);white-space:nowrap}
.hotnote{background:var(--t);color:var(--stage);border-radius:14px;padding:12px 14px;font-weight:800;text-align:center}
.handoff{text-align:center;align-items:center;padding-block:30px}
.handoff .name{font-family:var(--f-display);font-size:clamp(32px,10vw,50px);color:var(--bulb);line-height:1}
.progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.progress i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.progress i.on{background:var(--t)}

/* globus */
.globe{position:relative;height:270px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#2b1250,#0b0418 70%);box-shadow:0 0 0 2px var(--line)}
.globe.tall{height:min(62vh,420px)}
.globe canvas{display:block;width:100%;height:100%}
.globe .cap{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;pointer-events:none}
.globe .cap b{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,7vw,32px);color:var(--bulb);line-height:1;text-shadow:0 2px 12px #000}
.globe .cap span{font-weight:800;background:rgba(11,4,24,.7);padding:4px 10px;border-radius:8px}
.globe .flat{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

/* afsløring: detektivtavle */
.splid{position:relative;border-radius:14px;background:#120620;border:1px solid var(--line);overflow:hidden;height:64px}
.splid canvas{display:block;width:100%;height:100%}
.splid .sl{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.splid .sv{position:absolute;right:10px;top:8px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--bulb)}
.tboard{position:relative;display:flex;flex-direction:column;gap:56px;padding:14px 8px;border-radius:18px;background:repeating-linear-gradient(0deg,rgba(255,244,230,.03) 0 2px,transparent 2px 24px),#24103a;border:1px solid var(--line)}
.tboard .voters{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.tboard .vt{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;max-width:64px;text-align:center}
.tboard svg.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.tboard .cands{position:relative;z-index:2}
.tboard .who{background:rgba(42,17,66,.92);padding-top:22px;position:relative}
.cnt{position:absolute;top:-12px;left:50%;transform:translateX(-50%);min-width:28px;height:28px;border-radius:14px;background:var(--thread);color:var(--ink);font-family:var(--f-display);font-size:14px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px #24103a}
.cnt.bump{animation:bump .35s}
@keyframes bump{50%{transform:translateX(-50%) scale(1.4)}}
.who.win .av{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.who.lose{opacity:.55}
.pin{position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--thread);box-shadow:0 0 0 2px #24103a}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{border-radius:14px;padding:12px;background:var(--stage-2);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:opacity .4s,border-color .4s,background .4s}
.rrow .top{display:flex;justify-content:space-between;gap:8px;font-weight:800;align-items:center}
.rrow .who-list{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
.rrow.right{border-color:var(--ok);background:#173a35}
.rrow.wrong{opacity:.45}
.vote{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px 3px 3px;border-radius:999px;color:#1a0a2b;background:var(--pc);animation:drop .4s cubic-bezier(.2,1.6,.4,1) both}
.vote .av{--sz:18px;font-size:9px}
@keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}}
.mark{font-family:var(--f-display);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--ok);color:var(--stage);animation:slam .4s both}
.truth{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.truth .num{font-family:var(--f-shade);font-size:clamp(44px,14vw,70px);color:var(--bulb);line-height:1;font-variant-numeric:tabular-nums}
.verdict{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.verdict .big{font-family:var(--f-shade);font-size:clamp(40px,13vw,64px);color:var(--t);line-height:1;animation:slam .5s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 0 22px rgba(255,61,127,.5)}
@keyframes slam{from{transform:scale(3) rotate(-10deg);opacity:0}}
.title-badge{display:inline-block;background:var(--bulb);color:var(--stage);font-family:var(--f-display);font-size:15px;padding:8px 14px;border-radius:10px;transform:rotate(-2deg)}
.potline{font-weight:800}
.poster{width:min(220px,60vw);border-radius:6px;box-shadow:0 14px 30px -8px rgba(0,0,0,.7);transform:rotate(2deg);animation:posterin .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes posterin{from{transform:translateY(80px) rotate(-14deg) scale(.6);opacity:0}}
.gains{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gain{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--stage-2);font-weight:800;animation:pop .5s cubic-bezier(.2,1.8,.4,1) both}
.gain b{font-family:var(--f-display);font-weight:400;color:var(--ok)}
@keyframes pop{from{transform:scale(0)}}

/* bane til 21 */
.track{display:flex;flex-direction:column;gap:9px;background:var(--stage-2);border-radius:18px;padding:14px;border:1px solid var(--line)}
.lane{display:grid;grid-template-columns:64px 1fr 30px;gap:8px;align-items:center}
.lane .ln{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .rail{position:relative;height:30px;border-radius:999px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px calc(100%/21))}
.lane .rail::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;border-radius:3px;background:repeating-linear-gradient(0deg,var(--ink) 0 5px,var(--stage) 5px 10px)}
.lane .tok{position:absolute;top:0;left:0;transition:left 1.2s cubic-bezier(.3,1.4,.5,1)}
.lane .pts{font-family:var(--f-display);color:var(--bulb);text-align:right;font-variant-numeric:tabular-nums}

/* retssal */
.court{position:relative;border-radius:22px;padding:26px 16px 22px;background:radial-gradient(ellipse at 50% 0%,rgba(255,210,63,.28),transparent 60%),#120620;border:2px solid #4a2a10;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;overflow:hidden}
.court::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(138,90,42,.12) 0 3px,transparent 3px 40px);pointer-events:none}
.court h2{font-family:var(--f-shade);font-size:clamp(34px,11vw,54px);color:var(--bulb);position:relative}
.gavel{width:120px;height:80px;position:relative}
.gavel svg{width:100%;height:100%;overflow:visible}
.gavel .hd{transform-origin:85% 85%;animation:gavel 1.1s cubic-bezier(.5,0,.3,1) .2s both}
@keyframes gavel{0%{transform:rotate(-38deg)}55%{transform:rotate(-38deg)}70%{transform:rotate(4deg)}80%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.accused{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;position:relative}
.accused .who{background:transparent;border:0;padding:0}
.accused .av{filter:drop-shadow(0 0 22px rgba(255,210,63,.7))}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-shade);font-size:46px;color:var(--ink)}

/* hele skærmen */
#siren{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;pointer-events:none;background:radial-gradient(circle,rgba(255,45,77,.85),rgba(120,0,20,.95));animation:siren .5s steps(2) infinite}
#siren .s1{font-family:var(--f-shade);font-size:clamp(54px,17vw,110px);color:var(--ink);line-height:1}
#siren .s2{font-family:var(--f-display);font-size:18px;color:var(--bulb);margin-top:12px;letter-spacing:.1em;padding-inline:16px}
@keyframes siren{50%{background:radial-gradient(circle,rgba(255,210,63,.6),rgba(120,0,20,.95))}}
#crack{position:fixed;inset:0;z-index:31;pointer-events:none;width:100%;height:100%}
.flyer{position:fixed;z-index:35;width:64px;height:64px;pointer-events:none;object-fit:cover;border-radius:12px;will-change:transform}
.flyer.face{border-radius:50%}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(11,4,24,.95) 35%);display:flex;flex-direction:column;gap:6px;align-items:center}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const norm=s=>String(s||"").trim().toLowerCase();
const fmt=n=>Number(n).toLocaleString("da-DK");
const clone=o=>JSON.parse(JSON.stringify(o??null));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const noEx=pk=>{["trips","nicks","words","quiz","quotes","who"].forEach(k=>pk[k]=(pk[k]||[]).filter(x=>!x.ex));return pk};

function resizeImage(file,max=160,square=true,type="image/jpeg"){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let sw=img.width,sh=img.height,sx=0,sy=0;if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL(type,.75))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

  if(MUTED)return null;
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;
      const master=AC.createGain();master.gain.value=.85;master.connect(comp).connect(AC.destination);

      const len=AC.sampleRate*2.4,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,3.2)*(k<.01?k*100:1)}}

    if(AC.state==="suspended")AC.resume();return AC
  }catch(e){return null}
}

  start(){const a=ac();if(!a||this.on||!this.want||SND.mode==="quiet")return;this.on=true;this.step=0;this.next=a.currentTime+.1;const sx=60/104/4;
    this.timer=setInterval(()=>{const a=ac();if(!a||!this.on)return;while(this.next<a.currentTime+.15){this.play(this.step,this.next,sx);this.step++;this.next+=sx}},40)},
  play(st,t,sx){const s=st%16,bar=(st>>4)%8;
    const roots=[50,50,46,46,43,43,45,45],r=roots[bar];
    // trommer: kick, rim, brush-hat
    if(s===0||s===10)V.kick(t,.3);if(s===4||s===12)V.snare(t,.07,.1);if(s%2===0)V.hat(t,.025,false,-.25);if(s===14)V.hat(t,.04,true,.25);
    // gående bas
    const walk=[0,0,7,0,10,0,7,5];if(s%2===0)V.pluck(NOTE(r-12+walk[s/2]),t,.2,{dur:.32,wet:.05});
    // messing-stød på 2-og
    if((s===6||s===14)&&bar%2===0){[r+12,r+15,r+19].forEach(n=>V.brass(NOTE(n),t,.14,.022))}
    // vibrafon-melodi
    const mel=[[74,null,77,null,81,null,79,77,null,null,74,null,72,null,null,null],[74,null,77,null,81,null,84,82,81,null,79,null,77,null,74,null]];

  },
  stop(){this.on=false;clearInterval(this.timer)},
  toggle(){this.want=!this.want;store("skyldig.theme",this.want);this.want?this.start():this.stop()}
};

  const own=(pack.who||[]).map(x=>[x.q,x.title||"Familiens dom"]);
  const trips=(pack.trips||[]).filter(t=>t.lat!=null);const K=x=>x[0];

    trip:freshFirst(tripItems,x=>x.k),tripyear:freshFirst(trips.filter(t=>t.year),t=>"år:"+t.place),
    quiz:freshFirst((pack.quiz||[]).map(x=>({q:x.q,a:x.a,w:x.w,ex:x.ex})).concat((pack.words||[]).map(w=>({q:`Hvad betyder "${w.w}" i vores familie?`,a:w.def,w:shuffle((pack.words||[]).filter(o=>o!==w).map(o=>o.def).concat(shuffle(FAKE_DEFS))).slice(0,3),ex:w.ex}))),x=>x.q),

    else if(k==="est")rd={type:"est",q:it[0],ans:it[1],unit:it[2],key:it[0]};

/* seismograf for uenighed */
function seismo(el){
  const c=el.querySelector("canvas"),x=c.getContext("2d");let level=0,target=0,ph=0,alive=true;const hist=[];
  const loop=()=>{if(!document.body.contains(c)){alive=false;return}const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;level+=(target-level)*.08;ph+=.25;
    hist.push((Math.sin(ph)*.6+Math.sin(ph*2.7)*.3+(Math.random()-.5)*.8)*level);if(hist.length>140)hist.shift();
    x.clearRect(0,0,w,h);x.strokeStyle="rgba(255,244,230,.08)";x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
    x.strokeStyle=level>.8?"#ff2d4d":level>.4?"#ffd23f":"#4de0c5";x.lineWidth=2*devicePixelRatio;x.beginPath();hist.forEach((v,i)=>{const px=i/139*w,py=h*.58-v*h*.42;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);return {set(v){target=v}};
}

function networkSVG(players,stats){
  const n=players.length,W=320,H=280,cx=W/2,cy=H/2,R=n<=2?80:105;const pos={};players.forEach((p,i)=>{const a=-Math.PI/2+i/n*Math.PI*2;pos[p.id]=[cx+Math.cos(a)*R,cy+Math.sin(a)*R]});
  let lines="",best=null,worst=null;
  Object.entries(stats||{}).forEach(([k,v])=>{const [a,b]=k.split("|");if(!pos[a]||!pos[b])return;const [x1,y1]=pos[a],[x2,y2]=pos[b];
    if(v.dis)lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff2d4d" stroke-width="${1.5+v.dis*1.6}" stroke-linecap="round" opacity=".85"/>`;
    if(v.agree)lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4de0c5" stroke-width="${1+v.agree*1.1}" stroke-dasharray="2 6" stroke-linecap="round" opacity=".9"/>`;
    const mx=(x1+x2)/2,my=(y1+y2)/2;lines+=`<text x="${mx}" y="${my+4}" text-anchor="middle" font-family="Bungee, sans-serif" font-size="12" fill="#fff4e6" stroke="#1a0a2b" stroke-width="3" paint-order="stroke">${v.dis}</text>`;
    if(!worst||v.dis>worst.v.dis)worst={a,b,v};if(!best||v.agree-v.dis>best.v.agree-best.v.dis)best={a,b,v}});
  const nodes=players.map(p=>{const [x,y]=pos[p.id];return `<g><circle cx="${x}" cy="${y}" r="24" fill="${p.color}" stroke="#1a0a2b" stroke-width="4"/>${p.photo?`<clipPath id="cp${esc(p.id)}"><circle cx="${x}" cy="${y}" r="22"/></clipPath><image href="${p.photo}" x="${x-22}" y="${y-22}" width="44" height="44" clip-path="url(#cp${esc(p.id)})" preserveAspectRatio="xMidYMid slice"/>`:`<text x="${x}" y="${y+7}" text-anchor="middle" font-family="Bungee, sans-serif" font-size="20" fill="#1a0a2b">${esc(p.name[0])}</text>`}<text x="${x}" y="${y+42}" text-anchor="middle" font-weight="800" font-size="13" fill="#fff4e6">${esc(p.name)}</text></g>`}).join("");
  const cap=[];if(worst&&worst.v.dis)cap.push(`<b style="color:#ff2d4d">Største modstandere:</b> ${esc(P(worst.a).name)} og ${esc(P(worst.b).name)} var uenige ${worst.v.dis} gange.`);
  if(best&&best.v.agree&&!(worst&&best.a===worst.a&&best.b===worst.b))cap.push(`<b style="color:#4de0c5">Uadskillelige:</b> ${esc(P(best.a).name)} og ${esc(P(best.b).name)} var enige ${best.v.agree} gange. Mistænkeligt.`);
  return `<svg class="netw" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Hvem var enige og uenige">${lines}${nodes}</svg><div class="col-stack" style="gap:6px">${cap.map(c=>`<p>${c}</p>`).join("")||'<p class="muted">Ikke nok Hvem af os-runder til et kort.</p>'}</div><p class="muted" style="font-size:13px">Rød streg: uenigheder. Prikket grøn: enigheder. Tallet er antal uenigheder.</p>`;
}

function catsHTML(){const c=S.cats||(S.cats=store("skyldig.cats")||["kaerligt","sjove","spicy"]);return `<div class="seg" id="cats">${Object.entries(CATS).map(([k,v])=>`<button type="button" data-cat="${k}" aria-pressed="${c.includes(k)}">${v}</button>`).join("")}</div><p class="muted" style="font-size:13px">Vælg en eller flere kategorier.</p>`}
function wireCats(after){app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{const k=b.dataset.cat;let c=(S.cats||[]).slice();c=c.includes(k)?c.filter(x=>x!==k):c.concat(k);if(!c.length){SFX.boing();return}S.cats=c;store("skyldig.cats",c);SFX.select();after()})}
S.vote=S.vote||store("skyldig.vote")||"flertal";
function voteHTML(){return `<div class="seg2">${[["flertal","Flertallet bestemmer"],["en","Én bestemmer på skift"]].map(([k,t])=>`<button type="button" class="${S.vote===k?"on":""}" data-vote="${k}">${t}</button>`).join("")}</div>`}
function wireVote(re){app.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{S.vote=b.dataset.vote;store("skyldig.vote",S.vote);SFX.tap();re()})}
function setupView(){
  setTheme("who");

    $("#back").onclick=()=>go("home");
    $("#addf").onsubmit=e=>{e.preventDefault();const n=$("#nm").value.trim();if(n&&S.lp.length<8&&!S.lp.some(p=>p.name===n)){S.lp.push({id:"p"+Date.now(),name:n,color:COLORS[S.lp.length%8]});SFX.coin();paint();$("#nm").focus()}};
    app.querySelectorAll(".x").forEach(b=>b.onclick=()=>{S.lp.splice(+b.dataset.i,1);SFX.boing();paint()});
    app.querySelectorAll("[data-sf]").forEach(inp=>inp.onchange=async()=>{if(!inp.files[0])return;try{S.lp[+inp.dataset.sf].photo=await resizeImage(inp.files[0],160);SFX.coin();paint()}catch(e){}});
    wireCats(paint);wireVote(paint);

  };

function localNext(skip){
  const G=S.G;if(!skip&&someoneWon(G.scores))return finalScreen(G,S.players,"Spil igen",()=>go("setup"));
  const p=prepRound(G,S.players,skip);if(!p)return finalScreen(G,S.players,"Spil igen",()=>go("setup"));
  Object.assign(G,p);markSeen(G.rd.key);S.ans={};S.order=S.players.map(x=>x.id);if(G.rd.judge)S.order.sort((a,b)=>(b===G.rd.judge)-(a===G.rd.judge));S.ai=0;S.lstep="intro";S.view="local";showTray(false);render();
}
function localView(){
  const G=S.G,rd=G.rd;setTheme(rd.type);
  if(S.lstep==="intro"){
    SFX.intro();
    app.innerHTML=`${hud(G.n)}${typeCard(rd)}${rd.trip?globeHTML("ig",false,tripCap(rd)):""}${qcard(rd,"Runde "+G.n)}<button class="btn" id="go">${rd.judge?`Start med ${esc(P(rd.judge).name)}`:"Send telefonen rundt"}</button><button class="link" id="skipq">Spring runden over</button>`;
    wireMute();if(rd.trip&&$("#ig")){GLOBE.mount($("#ig"));GLOBE.flyTo(rd.trip.lat,rd.trip.lon,rd.trip.country)}
    $("#go").onclick=()=>{SFX.whoosh();S.lstep="handoff";render()};$("#skipq").onclick=()=>{SFX.whoosh();localNext()};return;
  }
  if(S.lstep==="court"){app.innerHTML=courtHTML(G,COURT_SEC.indsigelse);wireMute();runCourt(COURT_SEC.indsigelse,()=>{S.ans={};S.ai=0;S.order=G.rd.judge?[G.rd.judge]:S.players.map(x=>x.id);S.lstep="handoff";render()});return}
  if(S.lstep==="handoff"){const p=P(S.order[S.ai]),isJ=rd.judge===p.id;
    app.innerHTML=`${hud(G.n)}<div class="panel handoff"><div class="lbl">${G.ph==="b"?(rd.judge?"Afgør igen · giv telefonen til":"Stem igen · giv telefonen til"):"Giv telefonen til"}</div>${av(p,"xl")}<div class="name">${esc(p.name)}</div>${nickOf(p.name)?`<div class="aka" style="font-size:16px">aka ${esc(nickOf(p.name))}</div>`:""}${isJ?`<div class="hotnote">${rd.type==="hot"?"Du sidder i stolen":"Du bestemmer"}</div>`:`<p class="muted">Ingen kigger med.</p>`}<div class="progress">${S.order.map((_,i)=>`<i class="${i<S.ai?"on":""}"></i>`).join("")}</div></div><button class="btn gold" id="me">Jeg er ${esc(p.name)}</button>`;
    wireMute();$("#me").onclick=()=>{SFX.tap();S.lstep="answer";render()};return}
  if(S.lstep==="answer"){const me=S.order[S.ai];
    const ui=answerUI(rd,me,a=>{S.ans[me]=a;S.ai++;if(S.ai>=S.order.length)localResolve();else setTimeout(()=>{S.lstep="handoff";render()},250)});
    app.innerHTML=`${hud(G.n)}${qcard(rd,P(me).name+" svarer")}${ui.html}`;wireMute();ui.wire();$("#num")?.focus();return}
}
function localResolve(){const G=S.G;Object.assign(G,resolve(G,S.ans,S.players));S.lstep="reveal";showRevealLocal()}
function showRevealLocal(){
  const G=S.G;const won=someoneWon(G.scores);const t=G.result.truth;
  const objBtn=canObject(G,t)?`<button class="btn red" id="obj">Indsigelse fra ${esc(P(t).name)}!</button>`:"";
  reveal(G,S.players,`${objBtn}<button class="btn gold" id="nx">${won?"Vi har en vinder":"Næste runde"}</button>`,{done(){
    $("#nx").onclick=()=>{SFX.whoosh();showTray(false);localNext()};
    const ob=$("#obj");if(ob)ob.onclick=()=>{Object.assign(G,objection(G,t));S.lstep="court";showTray(false);render()}}});
}

/* ---------- Rum uden opsætning: værtens telefon er selv serveren (direkte forbindelse mellem telefonerne) ---------- */
function lastGame(g,code,host){try{store("hb.last",{g,code,host:!!host,t:Date.now()})}catch(e){}}
function forgetGame(){try{store("hb.last",null)}catch(e){}}
function recentGame(){const l=store("hb.last");return l&&l.code&&Date.now()-l.t<12*3600e3?l:null}
async function resumeGame(){const l=recentGame();if(!l)return;await ON.init();
  if(l.g==="disko"){if(!DO.code||DO.code!==l.code){await DO.join(l.code)}else go("disco",{dv:"room"})}
  else{if(!ON.name)ON.name=store("skyldig.myname")||"";go("online",{sub:"wait"});await PACKDB.load();await ON.join(l.code,false)}}
const P2P_ERR={"no-network":"Kunne ikke få forbindelse. Tjek at telefonen er på internettet, og prøv igen.","no-room":"Fandt ikke rummet. Tjek koden, og at værtens telefon har spillet åbent.","offline":"Forbindelsen til værtens telefon røg. Vent et øjeblik, den prøver igen.","code-taken":"Koden var optaget. Prøv at oprette rummet igen."};
function netBar(){const k=PDB.key,bad=k&&(PDB.host?(!PDB.peer||PDB.peer.destroyed||PDB.peer.disconnected):!(PDB.conn&&PDB.conn.open));let b=document.getElementById("netbar");
  if(!bad){if(b){b.classList.add("ok");b.querySelector("span").textContent="Forbundet igen";clearTimeout(netBar.t);netBar.t=setTimeout(()=>{const x=document.getElementById("netbar");if(x&&x.classList.contains("ok"))x.remove()},1600)}return}
  if(!b){document.body.insertAdjacentHTML("beforeend",`<div id="netbar"><span></span><button type="button">Prøv igen</button></div>`);b=document.getElementById("netbar");b.querySelector("button").onclick=()=>{b.querySelector("span").textContent="Prøver…";PDB.heal(true)}}
  b.classList.remove("ok");b.querySelector("span").textContent=PDB.host?"Værtens telefon har mistet nettet. Prøver igen…":"Forbindelsen er væk. Prøver igen…"}
const PDB={docs:{},wl:null,
  wake(){try{if(navigator.wakeLock&&!this.wl)navigator.wakeLock.request("screen").then(l=>{this.wl=l;l.addEventListener("release",()=>{this.wl=null})}).catch(()=>{})}catch(e){}},ls:[],peer:null,conns:[],conn:null,key:null,host:false,evs:{},lib:null,retry:null,
  P:"hjemmebane-v1-",
  loadLib(){if(window.Peer)return Promise.resolve();if(this.lib)return this.lib;this.lib=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js";s.onload=ok;s.onerror=()=>{this.lib=null;no({code:"no-network"})};document.head.appendChild(s)});return this.lib},

      await ld("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await ld("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");

  subscribe(){

    const t=setTimeout(()=>{if(!this.R){this.err="Kan ikke nå rummet endnu. Tjek forbindelsen.";render()}},10000);

function nextSongFor(G,mode){
  const used=new Set(G.played||[]);const n=(G.n||0)+1;let type=mode==="bingo"?null:ROT[(n-1)%ROT.length];
  const prev=G.sid!=null?SONGS[G.sid]:null;if(type==="foreller"&&(!prev||prev.unsure))type="aar";
  const ok=s=>!used.has(s.id)&&(!type||!DRT[type].dated||!s.unsure)&&!(type==="foreller"&&prev&&s.year===prev.year);
  const lv=G.level||"svaer",inLv=s=>s.lvl===lv;let pool=SONGS.filter(s=>inLv(s)&&ok(s));if(!pool.length)pool=SONGS.filter(s=>inLv(s)&&!(type&&DRT[type].dated&&s.unsure));
  // vægt danske sange lidt op
  const s=Math.random()<.22?(shuffle(pool.filter(x=>x.dk))[0]||shuffle(pool)[0]):shuffle(pool)[0];
  return {n,sid:s.id,type,prev:prev?prev.id:null,played:[...(G.played||[]),s.id]};
}

function newBingoCard(){const sq=shuffle(BINGO_SQ.map((x,i)=>i)).slice(0,15);sq.splice(7,0,-1);return {sq,mark:{7:-1}}}
function bingoLines(m){const L=[];for(let r=0;r<4;r++)L.push([0,1,2,3].map(c=>r*4+c));for(let c=0;c<4;c++)L.push([0,1,2,3].map(r=>r*4+c));L.push([0,5,10,15],[3,6,9,12]);return L.filter(l=>l.every(i=>m[i]!=null)).length}
function bingoCard(R,players){
  const ck="disco.card."+DO.code;let card=D.card&&D.card.code===DO.code?D.card:store(ck);if(!card||!card.sq){card={...newBingoCard(),code:DO.code,done:{}};store(ck,card)}card.done=card.done||{};D.card=card;
  const cur=R.status==="reveal"&&R.sid!=null?SONGS[R.sid]:null;const canMark=!!cur&&!card.done[cur.id];
  const valid=cur?card.sq.map((k,i)=>k>=0&&card.mark[i]==null&&BINGO_SQ[k][1](cur)?i:-1).filter(i=>i>=0):[];
  const showHint=cur&&D.hint===cur.id;const lines=bingoLines(card.mark);

  ${cur?`<div class="dprev big"><span class="dsmall">Afsløret</span><b>${esc(cur.main)} · ${esc(cur.title)}</b>${cur.unsure?"":` <em>${cur.year}</em>`}</div>
    <p class="bstate ${canMark?"go":"done"}">${canMark?(showHint?(valid.length?"Det grønne felt passer. Kryds det nu.":"Ingen felter på din plade passer til denne sang."):"Kryds ét felt, der passer. Forkert felt = CHEATER!"):"Du har krydset for denne sang."}</p>`
   :`<div class="dprev big"><span class="dsmall">Lyt med</span><b>Der spilles en sang…</b></div><p class="bstate wait">Du kan krydse, når DJ'en afslører sangen.</p>`}

  <button class="dbtn bcall${lines>(card.called||0)?" ready":""}" id="dbingo" style="--c:${lines>(card.called||0)?"#ff3fa4":"#7a3cff"}">BINGO!</button>
  <p class="dsmall c">Glemmer du at krydse, før næste sang starter, er chancen væk. Tryk kun BINGO, når du har en hel række.</p>

    if(L>(card.called||0)){card.called=L;store(ck,card);SND.allow=true;DSFX.bingo();SND.allow=false;siren("BINGO!","Rejs dig og dans",true);[0,400,800].forEach(t=>setTimeout(()=>confetti(170,.3),t));DO.callBingo();DO.shown=null;bingoCard(DO.R,players)}
    else{snyder(L?"Den række har du allerede råbt for":"Du har ikke en hel række endnu");DO.cheat("bingo",R.n)}};
  app.querySelectorAll("[data-sq]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sq;
    if(card.mark[i]!=null)return;
    if(!cur){dToast("Vent til DJ'en afslører sangen");SFX.tap();return}
    if(!canMark){dToast("Du har allerede krydset for denne sang");SFX.tap();return}
    if(valid.includes(i)){card.mark[i]=cur.id;card.done[cur.id]=true;D.hint=null;store(ck,card);DSFX.stamp();

}

function snyder(sub="Det felt passer ikke",hold){

  const yell=()=>{SND.allow=true;DSFX.snyder();SND.allow=false;shout("Cheater! Cheater!",true,"en-US");shake()};yell();
  const off=()=>{const s=$("#snyder");if(s){s.style.transition="opacity .5s";s.style.opacity=0;setTimeout(()=>s.remove(),550)}};

function playIntro(scenes,{cls="",onEnd}={}){

    if(sc.music)eraMusic(sc.music,now(),sc.d/1000);if(sc.after)sc.after(el);timer=setTimeout(()=>{k++;k<scenes.length?show():end(false)},sc.d)};
  const end=skipped=>{if(ended)return;ended=true;clearTimeout(timer);introBusEnd(skipped?.15:.8);try{speechSynthesis.cancel()}catch(e){}el.classList.add("out");setTimeout(()=>el.remove(),600);onEnd&&onEnd()};
  el.querySelector(".i-skip").onclick=e=>{e.stopPropagation();end(true)};
  show();
}
