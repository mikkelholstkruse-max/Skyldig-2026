<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skyldig!">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a2b">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
</head>
<body>
<title>Skyldig!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: one-screen game-show stage with spotlight beams; every step is one focused card; the reveal is a detective board with red threads, a seismograph for disagreement and a race track to 21 */
:root{
  --stage:#1a0a2b;--stage-2:#2a1142;--stage-3:#3a1a58;
  --ink:#fff4e6;--muted:#c7a9d9;--hot:#ff3d7f;--bulb:#ffd23f;--thread:#ff2d4d;
  --line:rgba(255,244,230,.14);--ok:#5ef0a8;--bad:#ff6b6b;
  --t:var(--hot);
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-shade:"Bungee Shade","Bungee","Arial Black",sans-serif;
  --f-body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.shake #app{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-4px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
.beams{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.beams::before,.beams::after{content:"";position:absolute;top:-30%;width:90vmax;height:160vmax;opacity:.2;
  background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,var(--t) 175deg,transparent 190deg);transform-origin:50% 0;animation:sweep 9s ease-in-out infinite alternate}
.beams::before{left:-30vmax}
.beams::after{right:-30vmax;background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,var(--bulb) 175deg,transparent 190deg);animation-delay:-4s;opacity:.12}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#bg,#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#bg{z-index:0}#fx{z-index:40}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:18px 120px}

.marquee{position:relative;text-align:center;padding:20px 12px 16px;border-radius:18px;background:var(--stage-2);box-shadow:0 0 0 3px var(--hot),0 0 40px -6px var(--hot)}
.marquee::before{content:"";position:absolute;inset:6px;border-radius:13px;pointer-events:none;padding:5px;
  background:radial-gradient(circle,var(--bulb) 2.5px,transparent 3.5px) 0 0/16px 16px;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.logo{font-family:var(--f-shade);font-size:clamp(46px,15vw,78px);line-height:1;color:var(--bulb);margin:0;text-shadow:0 0 18px rgba(255,210,63,.55)}
.logo.sm{font-size:24px;text-shadow:none}
.tag{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;color:var(--hot);margin-top:8px;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.lbl{font-family:var(--f-display);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
p{margin:0}.muted{color:var(--muted)}.c{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col-stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--stage-2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:3px solid var(--bulb);outline-offset:2px}
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;padding:16px 20px;border-radius:14px;background:var(--hot);color:var(--stage);box-shadow:0 5px 0 #9e1747;transition:transform .08s,box-shadow .08s;width:100%;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9e1747}
.btn.gold{background:var(--bulb);box-shadow:0 5px 0 #a8820c}.btn.gold:active{box-shadow:0 1px 0 #a8820c}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.red{background:var(--thread);color:var(--ink);box-shadow:0 5px 0 #8a0f22}
.btn.sm{font-size:14px;padding:11px 14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
.iconbtn{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;padding:8px 10px;border-radius:999px;background:var(--stage-2);border:1px solid var(--line);color:var(--muted)}

.mode{display:grid;gap:12px}
.mode button{text-align:left;padding:18px;border-radius:16px;background:var(--stage-2);border:2px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:border-color .2s,transform .2s}
.mode button:hover{border-color:var(--hot);transform:translateY(-2px)}
.mode b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--bulb)}
.pitch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pitch div{border-radius:12px;padding:10px 12px;background:var(--stage-2);border-left:4px solid var(--c);font-size:13px;color:var(--muted)}
.pitch b{display:block;font-family:var(--f-display);font-weight:400;font-size:13px;color:var(--ink);letter-spacing:.04em}

input[type=text],input[type=number],textarea{font:inherit;width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--stage);color:var(--ink);min-width:0}
textarea{min-height:80px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--stage);padding:5px;border-radius:14px}
.seg button{padding:11px 4px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--hot);color:var(--stage)}

/* avatarer */
.av{--sz:30px;width:var(--sz);height:var(--sz);border-radius:50%;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:calc(var(--sz)*.45);color:#1a0a2b;background:var(--pc);flex:none;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.m{--sz:44px}.av.l{--sz:72px;box-shadow:0 0 0 3px var(--stage),0 0 0 6px var(--pc)}.av.xl{--sz:104px;box-shadow:0 0 0 4px var(--stage),0 0 0 8px var(--pc)}
.selfie{position:relative;display:inline-block;cursor:pointer}
.selfie input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.selfie .cam{position:absolute;right:-4px;bottom:-4px;background:var(--bulb);color:var(--stage);font-family:var(--f-display);font-size:9px;padding:3px 5px;border-radius:6px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--stage);border:1px solid var(--line);font-weight:700}
.chip .x{width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.aka{font-size:12px;color:var(--muted);font-weight:600;font-style:italic;display:block}

/* rundekort */
.typecard{position:relative;overflow:hidden;border-radius:22px;padding:28px 20px;text-align:center;background:var(--t);color:var(--stage);animation:typein .7s cubic-bezier(.2,1.3,.4,1) both}
.typecard::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 14px,transparent 14px 28px)}
@keyframes typein{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.typecard .big{position:relative;z-index:1;font-family:var(--f-shade);font-size:clamp(32px,10.5vw,52px);line-height:1}
.typecard .sub{position:relative;z-index:1;font-weight:800;margin-top:8px}
.event{border-radius:16px;padding:14px;text-align:center;background:var(--bulb);color:var(--stage);animation:typein .6s .3s both}
.event b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.qcard{position:relative;background:var(--ink);color:var(--stage);border-radius:22px;padding:26px 22px 22px;transform:rotate(-1.2deg);box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.qcard .lbl{color:#7b4f8f}
.qcard .q{font-family:var(--f-display);font-size:clamp(21px,6.3vw,29px);line-height:1.15;margin-top:8px;text-wrap:balance}
.qcard .q.quote{font-family:var(--f-body);font-weight:800;font-style:italic}
.qcard .stamp{position:absolute;top:-14px;right:14px;background:var(--t);color:var(--stage);font-family:var(--f-display);font-size:12px;padding:6px 10px;border-radius:8px;transform:rotate(4deg);letter-spacing:.08em}
.ex{display:inline-block;margin-left:6px;background:#7b4f8f;color:var(--ink);font-family:var(--f-display);font-size:10px;padding:2px 6px;border-radius:5px;vertical-align:middle;letter-spacing:.04em}
.deal{animation:deal .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes deal{from{transform:translateY(40px) rotate(8deg) scale(.8);opacity:0}}

.cands{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:16px;background:var(--stage-2);border:2px solid var(--line);font-weight:800;text-align:center;min-width:0;word-break:break-word}
.cands>:nth-child(2){animation-delay:.1s}.cands>:nth-child(3){animation-delay:.2s}.cands>:nth-child(4){animation-delay:.3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:16px 12px;border-radius:16px;background:var(--stage-2);border:2px solid var(--line);font-weight:800;font-size:17px;text-align:center;min-height:72px;display:flex;align-items:center;justify-content:center;gap:8px;word-break:break-word;min-width:0}
button.who:active,button.opt:active{transform:scale(.96)}
button[aria-pressed=true].who,button[aria-pressed=true].opt{border-color:var(--t);background:var(--stage-3);box-shadow:0 0 24px -4px var(--t)}
.numwrap{display:flex;gap:10px;align-items:center}
.numwrap input{font-family:var(--f-display);font-size:28px;text-align:center}
.numwrap span{font-weight:800;color:var(--muted);white-space:nowrap}
.hotnote{background:var(--t);color:var(--stage);border-radius:14px;padding:12px 14px;font-weight:800;text-align:center}
.handoff{text-align:center;align-items:center;padding-block:30px}
.handoff .name{font-family:var(--f-display);font-size:clamp(32px,10vw,50px);color:var(--bulb);line-height:1}
.progress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.progress i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.progress i.on{background:var(--t)}

/* globus */
.globe{position:relative;height:270px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#2b1250,#0b0418 70%);box-shadow:0 0 0 2px var(--line)}
.globe.tall{height:min(62vh,420px)}
.globe canvas{display:block;width:100%;height:100%}
.globe .cap{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;pointer-events:none}
.globe .cap b{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,7vw,32px);color:var(--bulb);line-height:1;text-shadow:0 2px 12px #000}
.globe .cap span{font-weight:800;background:rgba(11,4,24,.7);padding:4px 10px;border-radius:8px}
.globe .flat{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

/* afsløring: detektivtavle */
.splid{position:relative;border-radius:14px;background:#120620;border:1px solid var(--line);overflow:hidden;height:64px}
.splid canvas{display:block;width:100%;height:100%}
.splid .sl{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.splid .sv{position:absolute;right:10px;top:8px;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--bulb)}
.tboard{position:relative;display:flex;flex-direction:column;gap:56px;padding:14px 8px;border-radius:18px;background:repeating-linear-gradient(0deg,rgba(255,244,230,.03) 0 2px,transparent 2px 24px),#24103a;border:1px solid var(--line)}
.tboard .voters{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.tboard .vt{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;max-width:64px;text-align:center}
.tboard svg.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.tboard .cands{position:relative;z-index:2}
.tboard .who{background:rgba(42,17,66,.92);padding-top:22px;position:relative}
.cnt{position:absolute;top:-12px;left:50%;transform:translateX(-50%);min-width:28px;height:28px;border-radius:14px;background:var(--thread);color:var(--ink);font-family:var(--f-display);font-size:14px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px #24103a}
.cnt.bump{animation:bump .35s}
@keyframes bump{50%{transform:translateX(-50%) scale(1.4)}}
.who.win .av{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.who.lose{opacity:.55}
.pin{position:absolute;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--thread);box-shadow:0 0 0 2px #24103a}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{border-radius:14px;padding:12px;background:var(--stage-2);border:2px solid var(--line);display:flex;flex-direction:column;gap:8px;transition:opacity .4s,border-color .4s,background .4s}
.rrow .top{display:flex;justify-content:space-between;gap:8px;font-weight:800;align-items:center}
.rrow .who-list{display:flex;flex-wrap:wrap;gap:5px;min-height:22px}
.rrow.right{border-color:var(--ok);background:#173a35}
.rrow.wrong{opacity:.45}
.vote{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px 3px 3px;border-radius:999px;color:#1a0a2b;background:var(--pc);animation:drop .4s cubic-bezier(.2,1.6,.4,1) both}
.vote .av{--sz:18px;font-size:9px}
@keyframes drop{from{transform:translateY(-60px) scale(.6);opacity:0}}
.mark{font-family:var(--f-display);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--ok);color:var(--stage);animation:slam .4s both}
.truth{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.truth .num{font-family:var(--f-shade);font-size:clamp(44px,14vw,70px);color:var(--bulb);line-height:1;font-variant-numeric:tabular-nums}
.verdict{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.verdict .big{font-family:var(--f-shade);font-size:clamp(40px,13vw,64px);color:var(--t);line-height:1;animation:slam .5s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 0 22px rgba(255,61,127,.5)}
@keyframes slam{from{transform:scale(3) rotate(-10deg);opacity:0}}
.title-badge{display:inline-block;background:var(--bulb);color:var(--stage);font-family:var(--f-display);font-size:15px;padding:8px 14px;border-radius:10px;transform:rotate(-2deg)}
.potline{font-weight:800}
.poster{width:min(220px,60vw);border-radius:6px;box-shadow:0 14px 30px -8px rgba(0,0,0,.7);transform:rotate(2deg);animation:posterin .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes posterin{from{transform:translateY(80px) rotate(-14deg) scale(.6);opacity:0}}
.gains{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gain{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--stage-2);font-weight:800;animation:pop .5s cubic-bezier(.2,1.8,.4,1) both}
.gain b{font-family:var(--f-display);font-weight:400;color:var(--ok)}
@keyframes pop{from{transform:scale(0)}}

/* bane til 21 */
.track{display:flex;flex-direction:column;gap:9px;background:var(--stage-2);border-radius:18px;padding:14px;border:1px solid var(--line)}
.lane{display:grid;grid-template-columns:64px 1fr 30px;gap:8px;align-items:center}
.lane .ln{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .rail{position:relative;height:30px;border-radius:999px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px calc(100%/21))}
.lane .rail::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;border-radius:3px;background:repeating-linear-gradient(0deg,var(--ink) 0 5px,var(--stage) 5px 10px)}
.lane .tok{position:absolute;top:0;left:0;transition:left 1.2s cubic-bezier(.3,1.4,.5,1)}
.lane .pts{font-family:var(--f-display);color:var(--bulb);text-align:right;font-variant-numeric:tabular-nums}

/* retssal */
.court{position:relative;border-radius:22px;padding:26px 16px 22px;background:radial-gradient(ellipse at 50% 0%,rgba(255,210,63,.28),transparent 60%),#120620;border:2px solid #4a2a10;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;overflow:hidden}
.court::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(138,90,42,.12) 0 3px,transparent 3px 40px);pointer-events:none}
.court h2{font-family:var(--f-shade);font-size:clamp(34px,11vw,54px);color:var(--bulb);position:relative}
.gavel{width:120px;height:80px;position:relative}
.gavel svg{width:100%;height:100%;overflow:visible}
.gavel .hd{transform-origin:85% 85%;animation:gavel 1.1s cubic-bezier(.5,0,.3,1) .2s both}
@keyframes gavel{0%{transform:rotate(-38deg)}55%{transform:rotate(-38deg)}70%{transform:rotate(4deg)}80%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.accused{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;position:relative}
.accused .who{background:transparent;border:0;padding:0}
.accused .av{filter:drop-shadow(0 0 22px rgba(255,210,63,.7))}
.ring{position:relative;width:120px;height:120px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-shade);font-size:46px;color:var(--ink)}

/* hele skærmen */
#siren{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;pointer-events:none;background:radial-gradient(circle,rgba(255,45,77,.85),rgba(120,0,20,.95));animation:siren .5s steps(2) infinite}
#siren .s1{font-family:var(--f-shade);font-size:clamp(54px,17vw,110px);color:var(--ink);line-height:1}
#siren .s2{font-family:var(--f-display);font-size:18px;color:var(--bulb);margin-top:12px;letter-spacing:.1em;padding-inline:16px}
@keyframes siren{50%{background:radial-gradient(circle,rgba(255,210,63,.6),rgba(120,0,20,.95))}}
#crack{position:fixed;inset:0;z-index:31;pointer-events:none;width:100%;height:100%}
.flyer{position:fixed;z-index:35;width:64px;height:64px;pointer-events:none;object-fit:cover;border-radius:12px;will-change:transform}
.flyer.face{border-radius:50%}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(11,4,24,.95) 35%);display:flex;flex-direction:column;gap:6px;align-items:center}
.tray .tl{font-family:var(--f-display);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.tray .ti{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:4px 2px}
.tray button{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--stage-2);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);color:var(--stage)}
.tray button:active{transform:scale(.88)}
.tray img{width:100%;height:100%;object-fit:cover}

.scores{display:flex;flex-direction:column;gap:8px}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--stage-2)}
.score .pts{font-family:var(--f-display);font-size:20px;color:var(--bulb);font-variant-numeric:tabular-nums}
.score .ttl{font-size:13px;color:var(--muted)}
.score.lead{box-shadow:inset 0 0 0 2px var(--bulb)}
.netw{width:100%;height:auto;display:block}
.postergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.postergrid figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.postergrid img{width:100%;border-radius:4px;box-shadow:0 8px 18px -6px #000}

.code{font-family:var(--f-display);font-size:48px;letter-spacing:.2em;color:var(--bulb);text-align:center}
.note{font-size:14px;color:var(--muted);background:var(--stage-2);border-radius:12px;padding:12px 14px}
.err{color:#ffb3c9;text-align:center}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-family:var(--f-display);font-size:12px;padding:6px 10px;border-radius:999px;background:var(--stage-2);border:1px solid var(--line);letter-spacing:.06em;white-space:nowrap}

/* studie */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap;padding:9px 12px;border-radius:999px;background:var(--stage-2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--bulb);color:var(--stage);border-color:var(--bulb)}
.entry{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--stage);font-size:15px}
.entry div{flex:1;min-width:0;word-break:break-word}
.entry small{color:var(--muted);display:block}
.entry .x{color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--stage);max-width:100%}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(11,4,24,.8);color:var(--ink)}
.upl{position:relative;display:block}
.upl input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.judgebox{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:18px;animation:deal .5s both}
.vt.ok .av{box-shadow:0 0 0 3px var(--ok)}.vt.no{opacity:.45}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function resizeImage(file,max=160,square=true,type="image/jpeg"){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let sw=img.width,sh=img.height,sx=0,sy=0;if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL(type,.75))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

function noise(d=.1,vol=.08,freq=1200,at=0,sweep){const a=ac();if(!a)return;const t=a.currentTime+at,b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="bandpass";f.frequency.setValueAtTime(freq,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}

const JUDGE=t=>t==="who"||t==="trip"||t==="hot";

function freshFirst(list,key){const a=shuffle(list);return a.filter(x=>!SEEN.has(key(x))).concat(a.filter(x=>SEEN.has(key(x))))}
function buildSeq(cats,pack,count=90){
  cats=(cats&&cats.length?cats:["kaerligt","sjove","spicy"]).filter(c=>WHO[c]);
  let who=[];cats.forEach(c=>who=who.concat(WHO[c]));
  const own=(pack.who||[]).map(x=>[x.q,x.title||"Familiens dom"]);
  (pack.words||[]).forEach(w=>own.push([`Hvem siger oftest "${w.w}"?`,`Mester i "${w.w}"`]));
  const trips=(pack.trips||[]).filter(t=>t.lat!=null);const K=x=>x[0];
  const tripItems=trips.flatMap(t=>TRIPQ.map(q=>({t,q,k:t.place+": "+q[0]})));
  const pools={who:freshFirst(own,K).concat(freshFirst(who,K)),hot:freshFirst(HOT,K),trivia:freshFirst(TRIVIA,K),est:freshFirst(EST,K),
    trip:freshFirst(tripItems,x=>x.k),tripyear:freshFirst(trips.filter(t=>t.year),t=>"år:"+t.place),
    quiz:freshFirst((pack.quiz||[]).map(x=>({q:x.q,a:x.a,w:x.w,ex:x.ex})).concat((pack.words||[]).map(w=>({q:`Hvad betyder "${w.w}" i vores familie?`,a:w.def,w:shuffle((pack.words||[]).filter(o=>o!==w).map(o=>o.def).concat(shuffle(FAKE_DEFS))).slice(0,3),ex:w.ex}))),x=>x.q),
    quote:freshFirst(pack.quotes||[],x=>x.q)};
  // samme rejse ikke to gange i træk
  const tr=[];let rest=pools.trip.slice();while(rest.length){const last=tr[tr.length-1];let i=rest.findIndex(x=>!last||x.t.place!==last.t.place);if(i<0)i=0;tr.push(rest.splice(i,1)[0])}pools.trip=tr;
  const idx={};const take=k=>{const p=pools[k];idx[k]=idx[k]||0;return idx[k]<p.length?p[idx[k]++]:null};
  const pattern=["who","who","hot","who","trip","who","trivia","who","hot","who","trip","quote","who","est","who","hot","quiz","who","trip","tripyear"];
  const seq=[];
  for(let i=0;seq.length<count&&i<1200;i++){
    let k=pattern[i%pattern.length];let it=take(k);
    if(!it&&k!=="who"){k="who";it=take(k)}
    if(!it){k="hot";it=take(k)}
    if(!it)continue;let rd;
    if(k==="who")rd={type:"who",q:it[0],title:it[1],key:it[0]};
    else if(k==="hot")rd={type:"hot",q:it[0],opts:it[1],key:it[0]};
    else if(k==="trivia")rd={type:"trivia",q:it[0],ans:it[1][0],opts:shuffle(it[1]),key:it[0]};
    else if(k==="est")rd={type:"est",q:it[0],ans:it[1],unit:it[2],key:it[0]};
    else if(k==="trip")rd={type:"trip",q:`${it.t.place}${it.t.year?" "+it.t.year:""}: ${it.q[0]}`,title:`${it.q[1]} · ${it.t.place}`,trip:it.t,ex:!!it.t.ex,key:it.k};
    else if(k==="tripyear")rd={type:"tripyear",q:`Hvilket år var vi i ${it.place}?`,ans:Number(it.year),unit:"",trip:it,ex:!!it.ex,key:"år:"+it.place};
    else if(k==="quiz")rd={type:"quiz",q:it.q,ans:it.a,opts:shuffle([it.a,...(it.w||[]).filter(Boolean)].slice(0,4)),ex:!!it.ex,key:it.q};
    else if(k==="quote")rd={type:"quote",q:it.q,ans:it.who,ex:!!it.ex,key:it.q};
    if((seq.length+1)%6===0)rd.golden=true;
    seq.push(rd);
  }
  return seq;
}

function scoreAll(rd,ans,players){

  }else if(rd.type==="est"||rd.type==="tripyear"){const truth=Number(rd.ans);const g=ids.filter(id=>ans[id]!==undefined&&ans[id]!==""&&!isNaN(Number(ans[id])));let winners=[];if(g.length){const d=id=>Math.abs(Number(ans[id])-truth);const min=Math.min(...g.map(d));winners=g.filter(id=>d(id)===min);winners.forEach(id=>add(id,min===0?3:2))}r={truth,winners}}

}

function seismo(el){
  const c=el.querySelector("canvas"),x=c.getContext("2d");let level=0,target=0,ph=0,alive=true;const hist=[];
  const loop=()=>{if(!document.body.contains(c)){alive=false;return}const w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;level+=(target-level)*.08;ph+=.25;
    hist.push((Math.sin(ph)*.6+Math.sin(ph*2.7)*.3+(Math.random()-.5)*.8)*level);if(hist.length>140)hist.shift();
    x.clearRect(0,0,w,h);x.strokeStyle="rgba(255,244,230,.08)";x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
    x.strokeStyle=level>.8?"#ff2d4d":level>.4?"#ffd23f":"#4de0c5";x.lineWidth=2*devicePixelRatio;x.beginPath();hist.forEach((v,i)=>{const px=i/139*w,py=h*.58-v*h*.42;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);return {set(v){target=v}};
}

function networkSVG(players,stats){
  const n=players.length,W=320,H=280,cx=W/2,cy=H/2,R=n<=2?80:105;const pos={};players.forEach((p,i)=>{const a=-Math.PI/2+i/n*Math.PI*2;pos[p.id]=[cx+Math.cos(a)*R,cy+Math.sin(a)*R]});
  let lines="",best=null,worst=null;
  Object.entries(stats||{}).forEach(([k,v])=>{const [a,b]=k.split("|");if(!pos[a]||!pos[b])return;const [x1,y1]=pos[a],[x2,y2]=pos[b];
    if(v.dis)lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff2d4d" stroke-width="${1.5+v.dis*1.6}" stroke-linecap="round" opacity=".85"/>`;
    if(v.agree)lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4de0c5" stroke-width="${1+v.agree*1.1}" stroke-dasharray="2 6" stroke-linecap="round" opacity=".9"/>`;
    const mx=(x1+x2)/2,my=(y1+y2)/2;lines+=`<text x="${mx}" y="${my+4}" text-anchor="middle" font-family="Bungee, sans-serif" font-size="12" fill="#fff4e6" stroke="#1a0a2b" stroke-width="3" paint-order="stroke">${v.dis}</text>`;
    if(!worst||v.dis>worst.v.dis)worst={a,b,v};if(!best||v.agree-v.dis>best.v.agree-best.v.dis)best={a,b,v}});
  const nodes=players.map(p=>{const [x,y]=pos[p.id];return `<g><circle cx="${x}" cy="${y}" r="24" fill="${p.color}" stroke="#1a0a2b" stroke-width="4"/>${p.photo?`<clipPath id="cp${esc(p.id)}"><circle cx="${x}" cy="${y}" r="22"/></clipPath><image href="${p.photo}" x="${x-22}" y="${y-22}" width="44" height="44" clip-path="url(#cp${esc(p.id)})" preserveAspectRatio="xMidYMid slice"/>`:`<text x="${x}" y="${y+7}" text-anchor="middle" font-family="Bungee, sans-serif" font-size="20" fill="#1a0a2b">${esc(p.name[0])}</text>`}<text x="${x}" y="${y+42}" text-anchor="middle" font-weight="800" font-size="13" fill="#fff4e6">${esc(p.name)}</text></g>`}).join("");
  const cap=[];if(worst&&worst.v.dis)cap.push(`<b style="color:#ff2d4d">Største modstandere:</b> ${esc(P(worst.a).name)} og ${esc(P(worst.b).name)} var uenige ${worst.v.dis} gange.`);
  if(best&&best.v.agree&&!(worst&&best.a===worst.a&&best.b===worst.b))cap.push(`<b style="color:#4de0c5">Uadskillelige:</b> ${esc(P(best.a).name)} og ${esc(P(best.b).name)} var enige ${best.v.agree} gange. Mistænkeligt.`);
  return `<svg class="netw" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Hvem var enige og uenige">${lines}${nodes}</svg><div class="col-stack" style="gap:6px">${cap.map(c=>`<p>${c}</p>`).join("")||'<p class="muted">Ikke nok Hvem af os-runder til et kort.</p>'}</div><p class="muted" style="font-size:13px">Rød streg: uenigheder. Prikket grøn: enigheder. Tallet er antal uenigheder.</p>`;
}
async function finalScreen(G,players,againLabel,again){
  showTray(false);setTheme("est");const sc=G.scores||{},titles=G.titles||{};
  const list=players.slice().sort((a,b)=>(sc[b.id]||0)-(sc[a.id]||0)),top=sc[list[0]?.id]||0,champs=list.filter(p=>(sc[p.id]||0)===top);
  const trips=G.trips||[];
  app.innerHTML=`<div class="marquee"><div class="tag">Først til ${TARGET}</div><h1 class="logo" style="font-size:clamp(34px,10vw,54px);margin-top:10px">${champs.map(c=>esc(c.name)).join(" & ")}</h1><div class="tag" style="color:var(--bulb)">Kender familien bedst · ${top} point</div></div>
  ${trips.length?`<div class="panel"><div class="row" style="justify-content:space-between"><span class="lbl">Rejsefilmen</span><button class="iconbtn" id="replay">Afspil igen</button></div>${globeHTML("film",true,"")}</div>`:""}
  <div class="panel"><span class="lbl">Familiens uenighedskort</span>${networkSVG(players,G.stats)}</div>
  <div class="scores">${list.map(p=>`<div class="score${(sc[p.id]||0)===top?" lead":""}">${av(p,"m")}<div style="min-width:0"><div style="font-weight:800">${esc(p.name)}</div><div class="ttl">${(titles[p.id]||[]).length?esc(titles[p.id].join(" · ")):"Ingen titler. Mistænkeligt."}</div></div><span class="pts">${sc[p.id]||0}</span></div>`).join("")}</div>
  <button class="btn" id="again">${esc(againLabel)}</button><button class="link" id="home">Til forsiden</button>`;
  [0,600,1200].forEach(t=>setTimeout(()=>confetti(120,.2+Math.random()*.3),t));SFX.airhorn();setTimeout(SFX.fanfare,900);
  $("#again").onclick=again;$("#home").onclick=()=>{ON.leave();go("home")};
  if(trips.length&&$("#film")){const playFilm=async()=>{const el=$("#film");if(!el)return;GLOBE.mount(el);const cap=el.querySelector(".cap");
    for(const t of trips){if(!document.body.contains(el))return;cap.innerHTML=`<b>${esc(t.place)}${t.year?" "+esc(t.year):""}</b>`;await GLOBE.flyTo(t.lat,t.lon,t.country,{route:true,zoom:2.4});cap.innerHTML+=`<span>${esc(t.verdict)}</span>`;await sleep(2200)}
    if(document.body.contains(el)){cap.innerHTML=`<b>Slut</b><span>${trips.length} ${trips.length===1?"stop":"stop"} på aftenens rejse</span>`;GLOBE.idleSpin()}};
    playFilm();$("#replay").onclick=playFilm}
}

function findPlace(q){const n=norm(q);const p=PLACES.find(x=>norm(x[0])===n);if(p)return {place:p[0],lat:p[1],lon:p[2],country:p[3]};
  const dk=Object.keys(DK_COUNTRY).find(k=>norm(k)===n);const en=dk?DK_COUNTRY[dk]:null;GLOBE.init();
  const c=(GLOBE.countries||[]).find(c=>norm(c.name)===n||(en&&c.name===en));if(c)return {place:dk||c.name,lat:c.center[1],lon:c.center[0],country:c.name};
  const partial=PLACES.find(x=>norm(x[0]).startsWith(n)&&n.length>=3);if(partial)return {place:partial[0],lat:partial[1],lon:partial[2],country:partial[3]};return null}

function localNext(skip){
  const G=S.G;if(!skip&&someoneWon(G.scores))return finalScreen(G,S.players,"Spil igen",()=>go("setup"));
  const p=prepRound(G,S.players,skip);if(!p)return finalScreen(G,S.players,"Spil igen",()=>go("setup"));
  Object.assign(G,p);markSeen(G.rd.key);S.ans={};S.order=S.players.map(x=>x.id);if(G.rd.judge)S.order.sort((a,b)=>(b===G.rd.judge)-(a===G.rd.judge));S.ai=0;S.lstep="intro";S.view="local";showTray(false);render();
}
function localView(){
  const G=S.G,rd=G.rd;setTheme(rd.type);
  if(S.lstep==="intro"){
    SFX.intro();
    app.innerHTML=`${hud(G.n)}${typeCard(rd)}${rd.trip?globeHTML("ig",false,tripCap(rd)):""}${qcard(rd,"Runde "+G.n)}<button class="btn" id="go">${rd.judge?`Start med dommeren ${esc(P(rd.judge).name)}`:"Send telefonen rundt"}</button><button class="link" id="skipq">Vi har haft den · nyt spørgsmål</button>`;
    wireMute();if(rd.trip&&$("#ig")){GLOBE.mount($("#ig"));GLOBE.flyTo(rd.trip.lat,rd.trip.lon,rd.trip.country)}
    $("#go").onclick=()=>{SFX.whoosh();S.lstep="handoff";render()};$("#skipq").onclick=()=>{SFX.whoosh();localNext(true)};return;
  }
  if(S.lstep==="court"){app.innerHTML=courtHTML(G,COURT_SEC.indsigelse);wireMute();runCourt(COURT_SEC.indsigelse,()=>{S.ans={};S.ai=0;S.order=[G.rd.judge];S.lstep="handoff";render()});return}
  if(S.lstep==="handoff"){const p=P(S.order[S.ai]),isJ=rd.judge===p.id;
    app.innerHTML=`${hud(G.n)}<div class="panel handoff"><div class="lbl">${G.ph==="b"?"Dommeren beslutter igen · giv telefonen til":"Giv telefonen til"}</div>${av(p,"xl")}<div class="name">${esc(p.name)}</div>${nickOf(p.name)?`<div class="aka" style="font-size:16px">aka ${esc(nickOf(p.name))}</div>`:""}${isJ?`<div class="hotnote">${rd.type==="hot"?"Du sidder i stolen":"Du er dommer"}</div>`:`<p class="muted">Ingen kigger med.</p>`}<div class="progress">${S.order.map((_,i)=>`<i class="${i<S.ai?"on":""}"></i>`).join("")}</div></div><button class="btn gold" id="me">Jeg er ${esc(p.name)}</button>`;
    wireMute();$("#me").onclick=()=>{SFX.tap();S.lstep="answer";render()};return}
  if(S.lstep==="answer"){const me=S.order[S.ai];
    const ui=answerUI(rd,me,a=>{S.ans[me]=a;S.ai++;if(S.ai>=S.order.length)localResolve();else setTimeout(()=>{S.lstep="handoff";render()},250)});
    app.innerHTML=`${hud(G.n)}${qcard(rd,P(me).name+" svarer")}${ui.html}`;wireMute();ui.wire();$("#num")?.focus();return}
}
function localResolve(){const G=S.G;Object.assign(G,resolve(G,S.ans,S.players));S.lstep="reveal";showRevealLocal()}
function showRevealLocal(){
  const G=S.G;const won=someoneWon(G.scores);const t=G.result.truth;
  const objBtn=canObject(G,t)?`<button class="btn red" id="obj">Indsigelse fra ${esc(P(t).name)}!</button>`:"";
  reveal(G,S.players,`${objBtn}<button class="btn gold" id="nx">${won?"Vi har en vinder":"Næste runde"}</button>`,{done(){
    $("#nx").onclick=()=>{SFX.whoosh();showTray(false);localNext()};
    const ob=$("#obj");if(ob)ob.onclick=()=>{Object.assign(G,objection(G,t));S.lstep="court";showTray(false);render()}}});
}

/* =========================================================
   ONLINE: hver sin telefon
   ========================================================= */
const ON={
  db:null,user:null,room:null,rm:null,me:null,code:null,R:null,players:[],answers:[],unsub:[],err:"",inited:false,shown:null,busy:null,name:store("skyldig.myname")||"",photo:store("skyldig.myphoto")||null,
  init(){if(this._p)return this._p;this._p=(async()=>{const use=n=>{try{return Promise.resolve(window.claude.use(n)).catch(()=>null)}catch(e){return Promise.resolve(null)}};if(window.claude?.use){[this.db,this.user,this.room]=await Promise.all([use("db"),use("user"),use("room")]);try{if(this.user)this.me=await this.user.id()}catch(e){}}
    if(!this.db&&window.SKYLDIG_FIREBASE){try{const ld=src=>new Promise((r,j)=>{const s=document.createElement("script");s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)});
      await ld("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await ld("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
      firebase.initializeApp(window.SKYLDIG_FIREBASE);this.db=firebase.firestore();this.fb=true}catch(e){console.warn("Firebase kunne ikke starte",e)}}
    if(!this.me){this.me=store("skyldig.localid");if(!this.me){this.me="g"+Math.random().toString(36).slice(2,10);store("skyldig.localid",this.me)}}})();return this._p},
  async enter(){go("online",{sub:"wait"});await this.init();await PACKDB.load();S.sub=this.db?"join":"nodb";render()},
  ref(p=""){return this.db.doc("rooms/"+this.code+p)},
  subscribe(){
    this.unsub.forEach(u=>u());this.unsub=[];const base="rooms/"+this.code;
    const t=setTimeout(()=>{if(!this.R){this.err="Kan ikke nå rummet endnu. Tjek forbindelsen.";render()}},10000);
    const fail=e=>{this.err="Forbindelsen til rummet stoppede ("+e.code+"). Gå tilbage og hop ind igen.";render()};
    this.unsub.push(this.db.doc(base).onSnapshot(s=>{clearTimeout(t);this.R=s.exists?s.data():null;this.err="";this.hostCheck();render()},fail));
    this.unsub.push(this.db.collection(base+"/players").onSnapshot(s=>{this.players=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.joined-b.joined);this.hostCheck();if(this.R?.status==="lobby"||!this.R)render()},fail));
    this.unsub.push(this.db.collection(base+"/answers").onSnapshot(s=>{this.answers=s.docs.map(d=>d.data());this.hostCheck();if(this.R?.status==="play"||this.R?.status==="court")render()},fail));
    this.unsub.push(this.db.doc(base+"/ctl/objection").onSnapshot(s=>{if(s.exists)this.onObjection(s.data())},()=>{}));
    if(this.room?.join){this.rm=this.room.join("skyldig-"+this.code);this.unsub.push(this.rm.on("throw",m=>{if(!m.isMe&&m.data?.id)flyThrow(String(m.data.id),Number(m.data.s)||Math.random())}))}
    else if(this.fb){const since=Date.now();this.unsub.push(this.db.collection(base+"/throws").where("at",">",since).onSnapshot(s=>s.docChanges().forEach(c=>{const d=c.doc.data();if(c.type==="added"&&d.by!==this.me)flyThrow(String(d.id),Number(d.s)||Math.random())}),()=>{}))}
  },
  emitThrow(id){try{if(this.rm)this.rm.emit("throw",{id,s:Math.random()});else if(this.fb&&this.code)this.db.collection("rooms/"+this.code+"/throws").add({id,s:Math.random(),at:Date.now(),by:this.me})}catch(e){}},
  leave(){this.unsub.forEach(u=>u());this.unsub=[];try{this.rm?.leave?.()}catch(e){}this.rm=null;this.code=null;this.R=null;this.players=[];this.answers=[];this.shown=null},
  isHost(){return !!this.R&&this.R.host===this.me},
  async write(fn){try{await fn();return true}catch(e){this.err=e.code==="invalid_argument"?"Din konto må ikke skrive i spillet. Ejeren skal dele det med dig som redaktør.":"Kunne ikke gemme ("+(e.code||"fejl")+"). Prøv igen.";render();return false}},
  async setRoom(patch){const next={...this.R,...patch};this.R=next;return this.write(()=>this.ref().set(clone(next)))},
  async join(code,create){
    const name=this.name.trim();if(!name){this.err="Skriv dit navn først.";return render()}
    store("skyldig.myname",name);this.code=code;this.err="";
    if(create){if(!await this.write(()=>this.ref().set({host:this.me,status:"lobby",cats:S.cats||["kaerligt","sjove","spicy"],created:Date.now()})))return}
    else{const s=await this.ref().get().catch(()=>null);if(!s||!s.exists){this.err="Ingen rum med koden "+code+".";this.code=null;return render()}}
    const ex=await this.ref("/players/"+this.me).get().catch(()=>null);
    if(!await this.write(()=>this.ref("/players/"+this.me).set({name,photo:this.photo||null,joined:ex?.exists?ex.data().joined:Date.now()})))return;
    SFX.coin();this.subscribe();S.sub="room";render();
  },
  async setPhoto(file){try{this.photo=await resizeImage(file,160);store("skyldig.myphoto",this.photo);if(this.code)await this.write(()=>this.ref("/players/"+this.me).update({photo:this.photo}));render()}catch(e){}},
  colored(){return this.players.map((p,i)=>({id:p.id,name:p.name,photo:p.photo||null,color:COLORS[i%8]}))},
  async start(){await PACKDB.load();const G=newGame(buildSeq(this.R.cats,PACK,90));await this.setRoom({...G,status:"starting"});this.next()},
  async next(){if(someoneWon(this.R.scores))return this.setRoom({status:"end"});this.busy=null;const p=prepRound(this.R,this.colored());if(!p)return this.setRoom({status:"end"});markSeen(p.rd.key);await this.setRoom(p)},
  async skipQ(){const p=prepRound(this.R,this.colored(),true);if(!p)return;this.busy=null;markSeen(p.rd.key);SFX.whoosh();await this.setRoom(p)},
  answersFor(){const R=this.R,v={};this.answers.filter(x=>x.n===R?.n&&x.ph===R?.ph).forEach(x=>v[x.uid]=x.a);return v},
  async answer(a){const R=this.R;await this.write(()=>this.ref(`/answers/r${R.n}${R.ph}-${this.me}`).set({n:R.n,ph:R.ph,uid:this.me,a}))},
  hostCheck(force){
    const R=this.R;if(!this.isHost()||!R||(R.status!=="play"&&R.status!=="court"))return;const key=R.n+R.ph;if(this.busy===key)return;
    const v=this.answersFor(),ps=this.colored(),need=ps.filter(p=>needsAnswer(R,p.id));
    if(R.rd.judge&&!(R.rd.judge in v))return;
    if(force||(need.length&&need.every(p=>p.id in v))){if(!Object.keys(v).length)return;this.busy=key;this.setRoom(resolve(R,v,ps))}
  },
  async objectNow(){const R=this.R;await this.write(()=>this.ref("/ctl/objection").set({n:R.n,uid:this.me,at:Date.now()}))},
  onObjection(o){const R=this.R;if(!this.isHost()||!R||R.status!=="reveal"||o.n!==R.n)return;if(!canObject(R,o.uid))return;this.busy=null;this.setRoom(objection(R,o.uid))},
  async kick(id){if(this.isHost())await this.write(()=>this.ref("/players/"+id).delete())}
};
const selfieBtn=()=>`<label class="selfie">${av({name:ON.name||"?",color:"#ffd23f",photo:ON.photo},"l")}<span class="cam">FOTO</span><input type="file" accept="image/*" capture="user" id="myself" aria-label="Tag en selfie"></label>`;
function wireSelfie(){const i=$("#myself");if(i)i.onchange=()=>{if(i.files[0])ON.setPhoto(i.files[0])}}
function onlineView(){
  const o=ON;
  if(S.sub==="wait"){app.innerHTML=`<div class="marquee"><h1 class="logo sm">Skyldig!</h1></div><p class="muted c">Forbinder…</p>`;return}
  if(S.sub==="nodb"){app.innerHTML=`<div class="marquee"><h1 class="logo sm">Skyldig!</h1></div><div class="panel"><h2>Kan ikke forbinde til rummene</h2><p class="muted">${window.claude?.use?"Spillet fik ikke adgang til sin database. Luk spillet helt, åbn det igen, og prøv en gang til.":"Hver sin telefon kræver en gratis Firebase-database. Opsætningen står i guiden på GitHub."} Indtil da kan I spille på én telefon.</p><button class="btn gold" id="retry">Prøv igen</button></div><button class="btn" id="b">Spil på én telefon</button><button class="link" id="h">Til forsiden</button>`;$("#b").onclick=()=>go("setup");$("#h").onclick=()=>go("home");const rt=$("#retry");if(rt)rt.onclick=()=>{ON._p=null;ON.enter()};return}
  if(S.sub==="join"){
    setTheme("who");
    app.innerHTML=`<div class="hud"><span class="logo sm">Skyldig!</span><button class="link" id="back">Tilbage</button></div>
    <div class="panel"><div class="row" style="flex-wrap:nowrap;gap:16px">${selfieBtn()}<div style="flex:1;min-width:0" class="col-stack"><div class="lbl">Dit navn</div><input type="text" id="myname" maxlength="16" value="${esc(o.name)}" placeholder="Fx Mor" autocomplete="off"></div></div><p class="muted" style="font-size:13px">Tryk på cirklen for en selfie. Den vises i spillet.</p></div>
    <div class="panel"><div class="lbl">Opret nyt rum</div>${catsHTML()}<button class="btn" id="create">Opret rum</button></div>
    <div class="panel"><div class="lbl">Eller hop ind med en kode</div><form id="jf" class="row" style="flex-wrap:nowrap"><input type="text" id="code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;font-family:var(--f-display);letter-spacing:.2em" autocomplete="off"><button class="btn gold sm">Hop ind</button></form></div>${o.err?`<p class="err">${esc(o.err)}</p>`:""}`;
    const keep=()=>o.name=$("#myname").value;$("#back").onclick=()=>go("home");wireSelfie();$("#myself").addEventListener("change",keep);
    wireCats(()=>{keep();render()});
    $("#create").onclick=()=>{keep();const L="ABCDEFGHJKLMNPRSTUVXYZ";o.join(Array.from({length:4},()=>L[Math.random()*L.length|0]).join(""),true)};
    $("#jf").onsubmit=e=>{e.preventDefault();keep();const c=$("#code").value.trim().toUpperCase();if(c.length===4)o.join(c,false)};return;
  }
  const R=o.R;
  if(!R){app.innerHTML=`<div class="marquee"><h1 class="logo sm">Skyldig!</h1></div><p class="muted c">${esc(o.err||"Henter rummet…")}</p><button class="link" id="h">Til forsiden</button>`;$("#h").onclick=()=>{o.leave();go("home")};return}
  S.players=o.colored();const err=o.err?`<p class="err">${esc(o.err)}</p>`:"";
  if(R.status==="lobby"||R.status==="starting"){
    o.shown=null;setTheme("who");
    app.innerHTML=`<div class="hud"><span class="logo sm">Skyldig!</span><div class="row" style="gap:6px"><span class="pill">${esc((R.cats||[]).map(c=>CATS[c]).join(" · "))}</span>${muteBtn()}</div></div>
    <div class="panel c"><div class="lbl">Rumkode</div><div class="code">${esc(o.code)}</div><p class="muted">Åbn spillet på hver telefon, tryk "Hver sin telefon" og skriv koden.</p></div>
    <div class="panel"><div class="lbl">I rummet (${S.players.length})</div><div class="chips">${S.players.map(p=>`<span class="chip deal">${p.id===o.me?selfieBtn().replace('class="av l"','class="av m"'):av(p,"m")}${esc(p.name)}${p.id===R.host?' <span class="muted" style="font-size:12px">vært</span>':""}${o.isHost()&&p.id!==o.me?`<button class="x" data-kick="${esc(p.id)}" aria-label="Fjern ${esc(p.name)}">×</button>`:""}</span>`).join("")}</div><p class="muted" style="font-size:13px">Tryk på dit eget billede for at tage en selfie.</p></div>
    ${o.isHost()?`<button class="btn" id="st" ${S.players.length<3||R.status==="starting"?"disabled":""}>${S.players.length<3?"Venter på mindst 3":"Start spillet"}</button>`:`<p class="muted c">Venter på at værten starter…</p>`}${err}<button class="link" id="lv">Forlad rummet</button>`;
    wireMute();wireSelfie();if(o.isHost()&&$("#st"))$("#st").onclick=()=>{SFX.airhorn();o.start()};
    app.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>o.kick(b.dataset.kick));$("#lv").onclick=()=>{o.leave();go("home")};return;
  }
  if((R.status==="play"||R.status==="court")&&R.rd){
    const rd=R.rd;setTheme(rd.type);const v=o.answersFor(),need=S.players.filter(p=>needsAnswer(R,p.id)),waitOnly=!needsAnswer(R,o.me),mine=(o.me in v)||waitOnly,done=need.filter(p=>p.id in v).length;
    const courtKey="court"+R.n;
    if(R.status==="court"&&o.shown!==courtKey&&!String(o.shown).startsWith(courtKey)){
      o.shown=courtKey;const sec=COURT_SEC.indsigelse;app.innerHTML=courtHTML(R,sec);wireMute();
      runCourt(sec,()=>{o.shown=courtKey+"-vote";render()});return;
    }
    if(R.status==="court"&&o.shown===courtKey)return;
    const key=R.status+R.n+R.ph+(mine?"-done":"");
    const prog=`<div class="progress" id="prog">${need.map(p=>`<i class="${p.id in v?"on":""}" title="${esc(p.name)}"></i>`).join("")}</div><p class="muted c" id="cnt2" style="font-size:14px">${done} af ${need.length} har svaret</p>`;
    const skip=o.isHost()?`<button class="link" id="skip">Fortsæt uden dem, der mangler</button>`:"";
    if(o.shown===key){const pr=$("#prog");if(pr)pr.outerHTML=prog.split("</div>")[0]+"</div>";const c=$("#cnt2");if(c)c.textContent=`${done} af ${need.length} har svaret`;return}
    o.shown=key;
    if(mine){app.innerHTML=`${hud(R.n)}${qcard(rd,waitOnly?"Ny dom":"Låst")}<div class="panel handoff"><div class="lbl">${waitOnly?"Dommeren beslutter igen":"Dit svar er låst"}</div><div class="name" style="font-size:28px">${waitOnly?esc(P(rd.judge).name)+" tænker…":"Venter på resten"}</div>${prog}</div>${skip}${err}`;wireMute();const sk=$("#skip");if(sk)sk.onclick=()=>o.hostCheck(true);return}
    const isRevote=R.status==="court";
    if(!isRevote)SFX.intro();
    app.innerHTML=`${hud(R.n)}${isRevote?"":typeCard(rd)}${!isRevote&&rd.trip?globeHTML("ig",false,tripCap(rd)):""}${qcard(rd,isRevote?"Genstemning":"Runde "+R.n)}<div id="ansArea" class="col-stack" hidden></div>${prog}${!isRevote&&o.isHost()&&!done?`<button class="link" id="skipq">Vi har haft den · nyt spørgsmål</button>`:""}${skip}${err}`;
    wireMute();const sk=$("#skip");if(sk)sk.onclick=()=>o.hostCheck(true);const sq=$("#skipq");if(sq)sq.onclick=()=>{sq.disabled=true;o.skipQ()};
    if(!isRevote&&rd.trip&&$("#ig")){GLOBE.mount($("#ig"));GLOBE.flyTo(rd.trip.lat,rd.trip.lon,rd.trip.country)}
    const delay=isRevote?0:rd.trip?3600:2400;
    setTimeout(()=>{if(o.shown!==key)return;const ui=answerUI(rd,o.me,a=>o.answer(a));const area=$("#ansArea");if(!area)return;app.querySelector(".typecard")?.remove();app.querySelector(".event")?.remove();area.innerHTML=ui.html;area.hidden=false;ui.wire();if(!isRevote)SFX.whoosh()},delay);
    return;
  }
  if(R.status==="reveal"&&R.result){
    const key="rev"+R.n+R.ph;if(o.shown===key)return;o.shown=key;setTheme(R.rd.type);
    const won=someoneWon(R.scores);
    const mayObj=canObject(R,o.me);
    const after=`${mayObj?`<button class="btn red" id="obj">Indsigelse!</button><p class="muted c" style="font-size:13px">Du kan gøre indsigelse én gang pr. spil.</p>`:""}${o.isHost()?`<button class="btn gold" id="nx">${won?"Vi har en vinder":"Næste runde"}</button>`:`<p class="muted c">Værten starter næste runde.</p>`}`;
    reveal(R,S.players,after,{me:o.me,done(){if(o.isHost()&&$("#nx"))$("#nx").onclick=e=>{e.target.disabled=true;SFX.whoosh();showTray(false);o.next()};const ob=$("#obj");if(ob)ob.onclick=()=>{ob.disabled=true;ob.textContent="Indsigelse sendt";o.objectNow()}}});
    return;
  }
  if(R.status==="end"){if(o.shown==="end")return;o.shown="end";finalScreen(R,S.players,o.isHost()?"Ny omgang i samme rum":"Venter på værten",()=>{if(o.isHost())o.setRoom({status:"lobby"})})}
}

PACKDB.load().then(()=>{if(S.view==="studio")render()});
render();
